name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check manifest and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tooling, manifest, and generated documentation
        run: just --jobs 3 check

      # Resolves every managed Bake target with manifest versions; no image is built.
      - name: Validate Bake targets
        run: bun scripts/dfcli/main.ts status
