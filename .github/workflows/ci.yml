name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check manifest and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Validate manifest
        run: bun scripts/dockerfiles.ts manifest:check

      - name: Check README generated region
        run: bun scripts/dockerfiles.ts readme --check

      # Resolves every managed Bake target with manifest versions; no image is built.
      - name: Validate Bake targets
        run: bun scripts/dockerfiles.ts status
