name: Publish GHCR

# Publishes manifest.yaml variants whose canonical tag is missing from GHCR.
# Existing canonical tags are never rebuilt; bump version.revision to republish.
on:
  push:
    branches:
      - master
    paths:
      - manifest.yaml
      - .github/workflows/ghcr.yml
  workflow_dispatch:
    inputs:
      images:
        description: Space-separated image or image.variant IDs. Empty publishes the whole manifest.
        required: false
        default: ""
      platforms:
        description: Platform override, e.g. linux/amd64. Empty uses each Bake target's platforms.
        required: false
        default: ""
      dry_run:
        description: Only report which tags would be built.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish missing tags
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # workflow_dispatch defaults are not populated on push events.
      - name: Resolve inputs
        id: params
        shell: bash
        env:
          INPUT_IMAGES: ${{ inputs.images }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "images=${INPUT_IMAGES:-}"
            echo "platforms=${INPUT_PLATFORMS:-}"
            echo "dry_run=${INPUT_DRY_RUN:-false}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        shell: bash
        env:
          IMAGES: ${{ steps.params.outputs.images }}
          PLATFORMS: ${{ steps.params.outputs.platforms }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" != "true" ]; then args+=(--push); fi
          if [ -n "$PLATFORMS" ]; then args+=(--platforms "$PLATFORMS"); fi
          read -r -a images <<< "$IMAGES"
          # Selectors are positional only; reject option-like input so it cannot become --push.
          for image in "${images[@]}"; do
            if [[ ! "$image" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "invalid image selector: $image" >&2
              exit 1
            fi
          done
          bun scripts/dockerfiles.ts publish "${args[@]}" -- "${images[@]}"
