# 镜像版本与依赖的统一入口；.github/workflows/ghcr.yml 据此发布 GHCR。
# 修改 version 后推送 master：缺失的 canonical tag 按依赖顺序构建，已发布的 tag 保持不变。
# track 声明应用版本的上游来源（apk / github / nodejs），dfcli update 据此升级版本。
# 其它镜像仍使用各自的 Bake 配置，README 会另外列出它们。
schema: 1
registry: ghcr.io/wenerme/dockerfiles
source: https://github.com/wenerme/dockerfiles

images:
  - name: base
    variants:
      - name: default
        build:
          dir: base/base
          target: base
          # 构建前下载 Alpine minirootfs
          prepare: dl
          variables:
            alpine: ALPINE_RELEASE
            revision: REV
        version:
          scheme: alpine
          alpine: "3.24.3"
          revision: 0

  - name: agent
    variants:
      - name: default
        build:
          dir: agent
          target: agent
          variables:
            alpine: ALPINE_RELEASE
            revision: REV
        base:
          image: base
          variant: default
          context: "wener/base:${alpine}"
        version:
          scheme: alpine
          revision: 0

  - name: pdns
    variants:
      - name: default
        build:
          dir: pdns
          target: pdns
          variables:
            app: VERSION
            alpine: ALPINE_RELEASE
            revision: REV
        base:
          image: base
          variant: default
          context: "wener/base:${alpine}"
        version:
          scheme: app
          app: "5.0.7"
          revision: 3
        track: { apk: pdns, pkgrel: false }

  - name: node-builder
    variants:
      - name: default
        build:
          dir: node-builder
          target: node-builder
          variables:
            app: VERSION
            alpine: ALPINE_RELEASE
            revision: REV
        base:
          image: base
          variant: default
          context: "wener/base:${alpine}"
        version:
          scheme: app-alpine
          app: "24.22.1"
          revision: 0
        # Node.js LTS line; follows the unofficial musl builds the Dockerfile downloads.
        track: { nodejs: "24" }

  - name: go-builder
    variants:
      - name: default
        build:
          dir: go-builder
          target: go-builder
          variables:
            app: GO_PACKAGE_VERSION
            alpine: ALPINE_RELEASE
            revision: REV
        # The parent Go image has an independent revision and remains a published external input.
        base:
          ref: "quay.io/wener/go:1.26.3-r0-alpine-3.24.1-r0@sha256:e2abf60cd8c81a1705edd458c81047ceda81349ec06d90149058b5053a7a7350"
          context: "wener/go:${app}-alpine-${alpine}-r0"
          arg: GO_BASE_IMAGE
        version:
          scheme: app-alpine
          app: "1.26.3-r0"
          alpine: "3.24.1"
          revision: 0

  - name: nginx
    variants:
      - name: default
        build:
          dir: nginx
          target: nginx
          variables:
            app: VERSION
            alpine: ALPINE_RELEASE
            revision: REV
        base:
          image: base
          variant: default
          context: "wener/base:${alpine}"
        version:
          scheme: app-alpine
          app: "1.30.4-r1"
          revision: 0
        track: { apk: nginx }

  - name: php
    variants:
      - name: "8.2"
        build:
          dir: php
          target: "82"
          variables:
            app: PHP82_VERSION
            alpine: PHP82_ALPINE_RELEASE
            revision: PHP82_REV
        # PHP 8.2 stays on historical Alpine/nginx, independently of base.default; not actively maintained.
        base:
          ref: "quay.io/wener/nginx:alpine-3.19.1@sha256:1da7b7845bed8cc54efb93d7289cb89c2bf87656159258a51ed7c0c3e1c449a5"
          context: "wener/nginx:alpine-${alpine}"
        version:
          scheme: app-alpine
          app: "8.2.26-r0"
          alpine: "3.19.1"
          revision: 0
        aliases: ["8.2", "8.2-alpine-${alpine}"]
      # PHP 8.3+ inherit Alpine from base through nginx; short aliases move to each new canonical tag.
      - name: "8.3"
        build:
          dir: php
          target: "83"
          variables:
            app: PHP83_VERSION
            alpine: PHP83_ALPINE_RELEASE
            revision: PHP83_REV
        base:
          image: nginx
          variant: default
          context: "wener/nginx:alpine-${alpine}"
        version:
          scheme: app-alpine
          app: "8.3.36-r0"
          revision: 0
        aliases: ["8.3", "8.3-alpine-${alpine}"]
        track: { apk: php83 }
      - name: "8.4"
        build:
          dir: php
          target: "84"
          variables:
            app: PHP84_VERSION
            alpine: PHP84_ALPINE_RELEASE
            revision: PHP84_REV
        base:
          image: nginx
          variant: default
          context: "wener/nginx:alpine-${alpine}"
        version:
          scheme: app-alpine
          app: "8.4.27-r0"
          revision: 0
        aliases: ["8.4", "8.4-alpine-${alpine}"]
        track: { apk: php84 }
      - name: "8.5"
        build:
          dir: php
          target: "85"
          variables:
            app: PHP85_VERSION
            alpine: PHP85_ALPINE_RELEASE
            revision: PHP85_REV
        base:
          image: nginx
          variant: default
          context: "wener/nginx:alpine-${alpine}"
        version:
          scheme: app-alpine
          app: "8.5.12-r0"
          revision: 0
        aliases: ["8.5", "8.5-alpine-${alpine}"]
        track: { apk: php85 }

  # Debian with the TUNA apt mirror; versions follow the official image's point-release tags.
  - name: debian
    variants:
      - name: default
        build:
          dir: debian
          target: debian
          variables:
            app: VERSION
            revision: REV
        base:
          ref: "docker.io/library/debian:${app}"
          context: "debian:${app}"
        version:
          scheme: app
          app: "13.7"
          revision: 0
        aliases: ["13", "trixie", "latest"]
        track: { docker: debian, prefix: "13." }
      - name: bookworm
        build:
          dir: debian
          target: debian
          variables:
            app: VERSION
            revision: REV
        base:
          ref: "docker.io/library/debian:${app}"
          context: "debian:${app}"
        version:
          scheme: app
          app: "12.15"
          revision: 0
        aliases: ["12", "bookworm"]
        track: { docker: debian, prefix: "12." }
